limit_req_zone $binary_remote_addr zone=ask_for_a_date_reports:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ask-for-a-date.lorqina.ir;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/ask-for-a-date-acme;
        default_type text/plain;
    }
    location / { return 301 https://ask-for-a-date.lorqina.ir$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ask-for-a-date.lorqina.ir;
    ssl_certificate /etc/letsencrypt/live/ask-for-a-date.lorqina.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ask-for-a-date.lorqina.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ask_for_a_date_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host ask-for-a-date.lorqina.ir;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    location = /api/report {
        limit_req zone=ask_for_a_date_reports burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3217;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / {
        proxy_pass http://127.0.0.1:3217;
    }
}
